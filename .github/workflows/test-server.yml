name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Ручной запуск

jobs:
  test-server:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx pytest pytest-asyncio
    
    - name: Start server in background
      run: |
        cd backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5  # Ждём запуска сервера
    
    - name: Test server with Python
      run: |
        cd backend
        python -c "
import httpx
import asyncio
import json

async def test():
    print('🚀 Testing server...')
    
    async with httpx.AsyncClient() as client:
        # 1. Проверяем, что сервер отвечает
        print('📡 Testing GET /...')
        resp = await client.get('http://localhost:8000/')
        print(f'   GET / -> {resp.status_code}')
        assert resp.status_code == 200
        
        # 2. Проверяем статику
        print('📡 Testing GET /style.css...')
        resp = await client.get('http://localhost:8000/style.css')
        print(f'   GET /style.css -> {resp.status_code}')
        assert resp.status_code == 200
        
        # 3. Проверяем main.js
        print('📡 Testing GET /main.js...')
        resp = await client.get('http://localhost:8000/main.js')
        print(f'   GET /main.js -> {resp.status_code}')
        assert resp.status_code == 200
        
        # 4. Проверяем регистрацию (новый эндпоинт)
        print('📡 Testing POST /auth/register-new...')
        payload = {
            'username': 'testuser',
            'email': 'test@example.com',
            'password': 'testpass123'
        }
        resp = await client.post(
            'http://localhost:8000/auth/register-new',
            json=payload
        )
        print(f'   POST /auth/register-new -> {resp.status_code}')
        print(f'   Response: {resp.json()}')
        assert resp.status_code == 200
        token = resp.json().get('access_token')
        assert token is not None
        print(f'   ✅ Token received: {token[:20]}...')
        
        # 5. Проверяем /auth/me с токеном
        print('📡 Testing GET /auth/me...')
        resp = await client.get(
            'http://localhost:8000/auth/me',
            headers={'Authorization': f'Bearer {token}'}
        )
        print(f'   GET /auth/me -> {resp.status_code}')
        assert resp.status_code == 200
        data = resp.json()
        assert data['username'] == 'testuser'
        print(f'   ✅ User: {data}')
        
        # 6. Проверяем вход
        print('📡 Testing POST /auth/login...')
        import httpx
        resp = await client.post(
            'http://localhost:8000/auth/login',
            data={'username': 'testuser', 'password': 'testpass123'},
            headers={'Content-Type': 'application/x-www-form-urlencoded'}
        )
        print(f'   POST /auth/login -> {resp.status_code}')
        assert resp.status_code == 200
        token2 = resp.json().get('access_token')
        assert token2 is not None
        print(f'   ✅ Login successful')
        
        print('\n✅ ALL TESTS PASSED!')

asyncio.run(test())
"
    
    - name: Test frontend with Playwright (optional)
      run: |
        echo "🧪 Testing frontend with Playwright..."
        cd frontend
        npm init -y
        npm install playwright
        npx playwright install chromium
        
        # Создаём простой тест на Playwright
        cat > test.js << 'EOF'
const { chromium } = require('playwright');

(async () => {
  console.log('🚀 Opening browser...');
  const browser = await chromium.launch();
  const page = await browser.newPage();
  
  console.log('📡 Navigating to http://localhost:8000 ...');
  await page.goto('http://localhost:8000');
  
  // Проверяем заголовок
  const title = await page.title();
  console.log(`   Page title: ${title}`);
  
  // Проверяем, что страница загрузилась
  const hasAuth = await page.locator('.auth-container').count();
  console.log(`   Auth container found: ${hasAuth > 0}`);
  
  await browser.close();
  console.log('✅ Frontend test passed!');
})().catch(e => {
  console.error('❌ Frontend test failed:', e);
  process.exit(1);
});
EOF
        node test.js
      continue-on-error: true  # Не критично, если фронтенд тест не пройдёт

    - name: Upload test results (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: |
          /tmp/*.log
          backend/*.log
        retention-days: 7
