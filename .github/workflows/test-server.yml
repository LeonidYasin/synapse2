name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start server
      run: |
        cd backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5

    - name: Check server is running
      run: |
        curl -s -o /dev/null -w "Server status: %{http_code}\n" http://localhost:8000/

    - name: Test API
      id: api-tests
      run: |
        cd backend
        python -c "
import httpx
import asyncio
import sys

async def test():
    print('🚀 Testing server...')
    async with httpx.AsyncClient() as client:
        resp = await client.get('http://localhost:8000/')
        print(f'GET / -> {resp.status_code}')
        if resp.status_code == 200:
            print('✅ Server is working!')
        else:
            print('❌ Server returned', resp.status_code)
            sys.exit(1)

asyncio.run(test())
"
      continue-on-error: true

    - name: Show summary
      if: always()
      run: |
        echo "=========================================="
        echo "📊 TEST SUMMARY"
        echo "=========================================="
        echo "API Tests: ${{ steps.api-tests.outcome }}"
        echo "=========================================="
