name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Syntax check
      run: |
        cd backend
        python -c "
import sys
import ast
files = ['app/main.py', 'app/routers/auth.py', 'app/models.py', 'app/database.py', 'app/auth.py']
for f in files:
    try:
        with open(f, 'r') as file:
            ast.parse(file.read())
        print(f'✅ {f} syntax OK')
    except Exception as e:
        print(f'❌ {f} ERROR: {e}')
        sys.exit(1)
print('✅ All files syntax OK')
"
