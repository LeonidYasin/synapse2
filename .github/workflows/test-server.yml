name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx pytest pytest-asyncio
    
    - name: Start server in background
      run: |
        cd backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
    
    - name: Run API tests
      id: api-tests
      run: |
        cd backend
        python -c "
import httpx
import asyncio
import json
import sys

async def test():
    print('🚀 Testing server...')
    all_passed = True
    errors = []
    
    async with httpx.AsyncClient() as client:
        # 1. GET /
        print('📡 Testing GET /...')
        resp = await client.get('http://localhost:8000/')
        print(f'   GET / -> {resp.status_code}')
        if resp.status_code != 200:
            all_passed = False
            errors.append('GET / returned ' + str(resp.status_code))
            print('   ❌ FAILED')
        else:
            print('   ✅ PASSED')
        
        # 2. GET /style.css
        print('📡 Testing GET /style.css...')
        resp = await client.get('http://localhost:8000/style.css')
        print(f'   GET /style.css -> {resp.status_code}')
        if resp.status_code != 200:
            all_passed = False
            errors.append('GET /style.css returned ' + str(resp.status_code))
            print('   ❌ FAILED')
        else:
            print('   ✅ PASSED')
        
        # 3. GET /main.js
        print('📡 Testing GET /main.js...')
        resp = await client.get('http://localhost:8000/main.js')
        print(f'   GET /main.js -> {resp.status_code}')
        if resp.status_code != 200:
            all_passed = False
            errors.append('GET /main.js returned ' + str(resp.status_code))
            print('   ❌ FAILED')
        else:
            print('   ✅ PASSED')
        
        # 4. POST /auth/register-new
        print('📡 Testing POST /auth/register-new...')
        payload = {
            'username': 'testuser',
            'email': 'test@example.com',
            'password': 'testpass123'
        }
        resp = await client.post(
            'http://localhost:8000/auth/register-new',
            json=payload
        )
        print(f'   POST /auth/register-new -> {resp.status_code}')
        if resp.status_code != 200:
            all_passed = False
            errors.append('POST /auth/register-new returned ' + str(resp.status_code))
            print('   ❌ FAILED')
            try:
                print(f'   Response: {resp.json()}')
            except:
                print(f'   Response: {resp.text}')
        else:
            data = resp.json()
            token = data.get('access_token')
            if token:
                print(f'   ✅ Token received: {token[:20]}...')
                print('   ✅ PASSED')
            else:
                all_passed = False
                errors.append('No token in /auth/register-new response')
                print('   ❌ No token in response')
        
        # 5. GET /auth/me
        if token:
            print('📡 Testing GET /auth/me...')
            resp = await client.get(
                'http://localhost:8000/auth/me',
                headers={'Authorization': f'Bearer {token}'}
            )
            print(f'   GET /auth/me -> {resp.status_code}')
            if resp.status_code == 200:
                data = resp.json()
                print(f'   User: {data}')
                if data.get('username') == 'testuser':
                    print('   ✅ PASSED')
                else:
                    all_passed = False
                    errors.append('Wrong username in /auth/me')
                    print('   ❌ Wrong username')
            else:
                all_passed = False
                errors.append('GET /auth/me returned ' + str(resp.status_code))
                print('   ❌ FAILED')
        
        # 6. POST /auth/login
        print('📡 Testing POST /auth/login...')
        resp = await client.post(
            'http://localhost:8000/auth/login',
            data={'username': 'testuser', 'password': 'testpass123'},
            headers={'Content-Type': 'application/x-www-form-urlencoded'}
        )
        print(f'   POST /auth/login -> {resp.status_code}')
        if resp.status_code == 200:
            data = resp.json()
            if data.get('access_token'):
                print('   ✅ PASSED')
            else:
                all_passed = False
                errors.append('No token in /auth/login response')
                print('   ❌ No token')
        else:
            all_passed = False
            errors.append('POST /auth/login returned ' + str(resp.status_code))
            print('   ❌ FAILED')
        
        print('')
        print('=' * 50)
        if all_passed:
            print('✅ ALL TESTS PASSED!')
            sys.exit(0)
        else:
            print('❌ SOME TESTS FAILED!')
            print('Errors:')
            for e in errors:
                print(f'  - {e}')
            sys.exit(1)

asyncio.run(test())
"
    
    - name: Show result summary
      run: |
        echo "=========================================="
        echo "📊 TEST SUMMARY"
        echo "=========================================="
        echo "Status: ${{ steps.api-tests.outcome }}"
        echo "=========================================="
      if: always()
