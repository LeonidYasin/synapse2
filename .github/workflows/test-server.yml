name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Start server
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run API tests
        id: api-tests
        run: |
          cd backend
          python test_server.py
        continue-on-error: true

      - name: Show summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 TEST SUMMARY"
          echo "=========================================="
          echo "API Tests: ${{ steps.api-tests.outcome }}"
          echo "=========================================="
