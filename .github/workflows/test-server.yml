name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest

    services:
      server:
        image: python:3.12-slim
        env:
          PYTHONPATH: /github/workspace/backend
        options: >-
          --workdir /github/workspace/backend
          --entrypoint python
        ports:
          - 8000:8000
        # Команда для запуска сервера
        command: -m uvicorn app.main:app --host 0.0.0.0 --port 8000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies in container
      run: |
        docker exec ${{ job.services.server.id }} pip install -r backend/requirements.txt

    - name: Wait for server
      run: |
        sleep 10
        curl -s -o /dev/null -w "Server status: %{http_code}\n" http://localhost:8000/

    - name: Run tests
      id: tests
      run: |
        cd backend
        python -c "
import httpx
import asyncio

async def test():
    print('🚀 Testing server...')
    async with httpx.AsyncClient() as client:
        resp = await client.get('http://localhost:8000/')
        print(f'GET / -> {resp.status_code}')
        if resp.status_code == 200:
            print('✅ Server is working!')
        else:
            print(f'❌ Server returned {resp.status_code}')

asyncio.run(test())
"
      continue-on-error: true

    - name: Show summary
      if: always()
      run: |
        echo "=========================================="
        echo "📊 TEST SUMMARY"
        echo "=========================================="
        echo "Tests: ${{ steps.tests.outcome }}"
        echo "=========================================="
