name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check imports
      run: |
        cd backend
        python -c "
import sys
import importlib

modules = [
    'app.main',
    'app.routers.auth',
    'app.models',
    'app.database',
    'app.auth'
]

for m in modules:
    try:
        importlib.import_module(m)
        print(f'✅ {m}')
    except Exception as e:
        print(f'❌ {m}: {e}')
        sys.exit(1)
print('✅ All modules imported successfully!')
"
