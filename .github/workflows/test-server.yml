name: Test Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx pytest
    
    - name: Start server
      run: |
        cd backend
        # Запускаем сервер в фоне с перенаправлением вывода в файл
        nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
        # Ждём и проверяем, что сервер запустился
        for i in {1..30}; do
          echo "Waiting for server... ($i/30)"
          if curl -s http://localhost:8000/ > /dev/null 2>&1; then
            echo "Server is running!"
            break
          fi
          sleep 2
        done
        # Проверяем, что сервер действительно запущен
        if ! curl -s http://localhost:8000/ > /dev/null 2>&1; then
          echo "❌ Server failed to start"
          cat server.log
          exit 1
        fi
    
    - name: Test server
      run: |
        cd backend
        python -c "
import httpx
import asyncio
import json

async def test():
    print('🚀 Testing server...')
    
    async with httpx.AsyncClient() as client:
        # 1. Проверяем, что сервер отвечает
        print('📡 Testing GET /...')
        resp = await client.get('http://localhost:8000/')
        print(f'   GET / -> {resp.status_code}')
        assert resp.status_code == 200
        
        # 2. Проверяем статику
        print('📡 Testing GET /style.css...')
        resp = await client.get('http://localhost:8000/style.css')
        print(f'   GET /style.css -> {resp.status_code}')
        assert resp.status_code == 200
        
        # 3. Проверяем main.js
        print('📡 Testing GET /main.js...')
        resp = await client.get('http://localhost:8000/main.js')
        print(f'   GET /main.js -> {resp.status_code}')
        assert resp.status_code == 200
        
        # 4. Проверяем регистрацию (новый эндпоинт)
        print('📡 Testing POST /auth/register-new...')
        import uuid
        username = f'testuser_{uuid.uuid4().hex[:8]}'
        payload = {
            'username': username,
            'email': f'{username}@example.com',
            'password': 'testpass123'
        }
        resp = await client.post(
            'http://localhost:8000/auth/register-new',
            json=payload
        )
        print(f'   POST /auth/register-new -> {resp.status_code}')
        print(f'   Response: {resp.text}')
        assert resp.status_code == 200
        token = resp.json().get('access_token')
        assert token is not None
        print(f'   ✅ Token received: {token[:20]}...')
        
        # 5. Проверяем /auth/me с токеном
        print('📡 Testing GET /auth/me...')
        resp = await client.get(
            'http://localhost:8000/auth/me',
            headers={'Authorization': f'Bearer {token}'}
        )
        print(f'   GET /auth/me -> {resp.status_code}')
        assert resp.status_code == 200
        data = resp.json()
        assert data['username'] == username
        print(f'   ✅ User: {data}')
        
        # 6. Проверяем вход
        print('📡 Testing POST /auth/login...')
        resp = await client.post(
            'http://localhost:8000/auth/login',
            data={'username': username, 'password': 'testpass123'},
            headers={'Content-Type': 'application/x-www-form-urlencoded'}
        )
        print(f'   POST /auth/login -> {resp.status_code}')
        assert resp.status_code == 200
        token2 = resp.json().get('access_token')
        assert token2 is not None
        print(f'   ✅ Login successful')
        
        # 7. Проверяем, что старый /auth/register работает (перенаправление)
        print('📡 Testing POST /auth/register (old, redirects to new)...')
        username2 = f'testuser_{uuid.uuid4().hex[:8]}'
        payload2 = {
            'username': username2,
            'email': f'{username2}@example.com',
            'password': 'testpass123'
        }
        resp = await client.post(
            'http://localhost:8000/auth/register',
            json=payload2
        )
        print(f'   POST /auth/register -> {resp.status_code}')
        assert resp.status_code == 200
        token3 = resp.json().get('access_token')
        assert token3 is not None
        print(f'   ✅ Token received from old endpoint')
        
        print('\n✅ ALL TESTS PASSED!')

asyncio.run(test())
"
    
    - name: Test frontend (optional)
      run: |
        echo "🧪 Testing frontend..."
        cd frontend
        # Простой тест — проверяем, что страница загружается
        if curl -s http://localhost:8000/ | grep -q "Синапс"; then
          echo "✅ Frontend contains title"
        else
          echo "⚠️ Frontend test skipped (no grep match)"
        fi
      continue-on-error: true
    
    - name: Upload server logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-logs
        path: backend/server.log
        retention-days: 7
