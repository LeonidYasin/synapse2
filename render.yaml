services:
  # Бэкенд API
  - type: web
    name: synapse-api
    runtime: python
    repo: https://github.com/LeonidYasin/synapse2
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString

  # Фронтенд
  - type: web
    name: synapse-frontend
    runtime: static
    repo: https://github.com/LeonidYasin/synapse2
    plan: free
    region: frankfurt
    buildCommand: echo "Static site ready"
    staticPublishPath: frontend
    envVars:
      - key: API_URL
        value: https://synapse-api.onrender.com

  # База данных — используем type: database вместо postgresql
  - type: database
    name: synapse-db
    plan: free
    region: frankfurt
