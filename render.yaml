services:
  - type: web
    name: synapse-api
    runtime: python
    repo: https://github.com/LeonidYasin/synapse2
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-db
          property: connectionString

  - type: static
    name: synapse-frontend
    repo: https://github.com/LeonidYasin/synapse2
    buildCommand: |
      echo "Copying frontend files..."
      cp -r frontend/* /opt/render/project/src/public/
    staticPublishPath: /public
    envVars:
      - key: API_URL
        value: https://synapse-api.onrender.com

  - type: postgresql
    name: synapse-db
    plan: free
    region: frankfurt
