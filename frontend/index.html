<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Синапс</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/style.css?v=2" />
    <script>
        // Принудительная очистка кэша для app.js
        window.APP_VERSION = '2.0.0';
        console.log('APP_VERSION:', window.APP_VERSION);
        
        // Удаляем старый service worker если есть
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                    console.log('SW unregistered:', registration);
                }
            });
        }
    </script>
</head>
<body>
    <div id="app"></div>
    <script>
        // Устанавливаем API_URL до загрузки app.js
        window.API_URL = 'https://polite-buses-pull.loca.lt';
        console.log('API_URL set to:', window.API_URL);
    </script>
    <script src="/app.js?v=2.0.0"></script>
</body>
</html>
