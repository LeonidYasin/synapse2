<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Синапс — ИИ-помощник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🧠 Синапс</h1>
            <div class="settings">
                <div id="authSection">
                    <input type="text" id="loginInput" placeholder="Логин" />
                    <input type="password" id="passwordInput" placeholder="Пароль" />
                    <button id="registerBtn">Регистрация</button>
                    <button id="loginBtn">Вход</button>
                    <button id="logoutBtn" style="display:none;">Выход</button>
                </div>
                <input type="text" id="apiKeyInput" placeholder="API-ключ (опционально)" />
                <button id="analyzeBtn">Анализировать диалоги</button>
            </div>
        </header>
        <main>
            <div id="chatContainer">
                <div id="messages"></div>
                <div id="inputArea">
                    <textarea id="userInput" rows="3" placeholder="Напишите сообщение..."></textarea>
                    <button id="sendBtn">Отправить</button>
                </div>
            </div>
            <div id="profileSidebar">
                <h3>Ваш профиль</h3>
                <div id="profileContent">
                    <p>Войдите в систему, чтобы увидеть свой профиль.</p>
                </div>
                <h3>Рекомендации</h3>
                <div id="recommendationsContent">
                    <p>Войдите в систему для получения рекомендаций.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
